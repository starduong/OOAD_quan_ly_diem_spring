    deactivate Controller
end

@enduml
```

#### 2.2.3. Thống kê điểm trung bình - Chi tiết

```plantuml
@startuml
title Thống kê điểm trung bình - Chi tiết tương tác

actor "Lãnh Đạo" as LD
participant ":ThongKeController" as Controller
participant ":ThongKeService" as Service
participant ":DiemRepository" as DiemRepo
participant ":AnalyticsService" as Analytics
database "Database" as DB

LD -> Controller : GET /api/thongke/overview
activate Controller
Controller -> Service : getThongKeOverview()
activate Service

Service -> DiemRepo : getStatisticsSummary()
activate DiemRepo
DiemRepo -> DB : SELECT \n  COUNT(DISTINCT MA_SV) as tongSV,\n  AVG(DIEM_TONG_KET) as diemTB,\n  COUNT(CASE WHEN DIEM_TONG_KET >= 5 THEN 1 END) as soDau,\n  COUNT(CASE WHEN DIEM_TONG_KET < 5 THEN 1 END) as soRot\nFROM DIEM
activate DB
DB --> DiemRepo : ResultSet
deactivate DB
DiemRepo --> Service : StatisticsSummary
deactivate DiemRepo

Service --> Controller : ThongKeOverview
deactivate Service
Controller --> LD : 200 OK + dữ liệu tổng quan
deactivate Controller

LD -> Controller : POST /api/thongke/filter
note right
  Body: {
    "khoa": "CNTT",
    "lop": "19TCLC_DT3",
    "hocKy": "1",
    "namHoc": "2024-2025",
    "maMon": "MON01"
  }
end note
activate Controller

Controller -> Service : getThongKeWithFilter(filter)
activate Service

Service -> DiemRepo : findWithFilter(filter)
activate DiemRepo
DiemRepo -> DB : SELECT d.*, sv.HO, sv.TEN, mh.TEN_MON, l.TEN_LOP\nFROM DIEM d\nJOIN SINH_VIEN sv ON d.MA_SV = sv.MA_SV\nJOIN MON_HOC mh ON d.MA_MON = mh.MA_MON\nJOIN LOP_TIN_CHI l ON d.MA_LOP = l.MA_LOP\nWHERE l.HOC_KY = ? AND l.NAM_HOC = ?\nAND sv.KHOA = ? AND sv.LOP = ?\nAND d.MA_MON = ?
activate DB
DB --> DiemRepo : ResultSet
deactivate DB
DiemRepo --> Service : List<Diem>
deactivate DiemRepo

Service -> Analytics : analyzeData(listDiem)
activate Analytics

Analytics -> Analytics : calculateAverage()
Analytics -> Analytics : calculateMedian()
Analytics -> Analytics : calculateStandardDeviation()
Analytics -> Analytics : groupByRanges()
note right
  Xuất sắc: 9.0 - 10
  Giỏi: 8.0 - 8.9
  Khá: 7.0 - 7.9
  Trung bình: 5.5 - 6.9
  Yếu: < 5.5
end note

Analytics -> Analytics : calculatePassRate()
Analytics --> Service : AnalyticsResult
deactivate Analytics

Service -> Service : compareWithPreviousSemester(filter)
note right
  So sánh với học kỳ trước
  để xem xu hướng
end note

Service --> Controller : ThongKeDetailResponse
deactivate Service

Controller --> LD : 200 OK + dữ liệu thống kê chi tiết
deactivate Controller

opt Xuất báo cáo
    LD -> Controller : POST /api/thongke/export
    activate Controller
    Controller -> Service : exportReport(filter, format)
    activate Service
    
    alt format == "excel"
        Service -> Service : generateExcelReport()
        Service --> Controller : byte[] excelData
    else format == "pdf"
        Service -> Service : generatePDFReport()
        Service --> Controller : byte[] pdfData
    end
    
    deactivate Service
    Controller --> LD : File download
    deactivate Controller
end

@enduml
```

