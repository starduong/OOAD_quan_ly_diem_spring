### 2.2. Cụ thể hóa tương tác (tt-1 chi tiết)

#### 2.2.1. Cập nhật điểm thi - Chi tiết

```plantuml
@startuml
title Cập nhật điểm thi - Chi tiết tương tác

actor "Giảng Viên" as GV
participant ":DiemController" as Controller
participant ":DiemService" as Service
participant ":TaiKhoanService" as AuthService
participant ":LopTinChiRepository" as LopRepo
participant ":SinhVienRepository" as SVRepo
participant ":DiemRepository" as DiemRepo
participant ":EmailService" as Email
database "Database" as DB

GV -> Controller : POST /api/diem/nhap
activate Controller
Controller -> AuthService : validateToken(token)
activate AuthService
AuthService --> Controller : GiangVien
deactivate AuthService

Controller -> Service : getLopTinChiByGiangVien(maGV)
activate Service
Service -> LopRepo : findByMaGV(maGV)
activate LopRepo
LopRepo -> DB : SELECT * FROM LOP_TIN_CHI\nWHERE MA_GV = ?
activate DB
DB --> LopRepo : ResultSet
deactivate DB
LopRepo --> Service : List<LopTinChi>
deactivate LopRepo
Service --> Controller : List<LopTinChi>
deactivate Service

Controller --> GV : 200 OK + danh sách lớp
deactivate Controller

GV -> Controller : GET /api/diem/sinhvien/{maLop}
activate Controller
Controller -> Service : getSinhVienByLop(maLop)
activate Service
Service -> SVRepo : findByMaLop(maLop)
activate SVRepo
SVRepo -> DB : SELECT sv.*, d.*\nFROM SINH_VIEN sv\nLEFT JOIN DIEM d ON sv.MA_SV = d.MA_SV\nWHERE sv.MA_LOP = ?
activate DB
DB --> SVRepo : ResultSet
deactivate DB
SVRepo --> Service : List<SinhVien>
deactivate SVRepo
Service --> Controller : List<SinhVien>
deactivate Service
Controller --> GV : 200 OK + danh sách SV
deactivate Controller

GV -> Controller : POST /api/diem/luu
note right
  Body: {
    "maSV": "SV001",
    "maMon": "MON01",
    "maLop": "LTC001",
    "diemCC": 8.5,
    "diemGK": 7.0,
    "diemCK": 8.0
  }
end note
activate Controller

Controller -> Service : luuDiem(diemRequest)
activate Service

Service -> Service : validateDiem(diemRequest)
note right: Kiểm tra điểm hợp lệ (0-10)

Service -> DiemRepo : findByMaSVAndMaMon(maSV, maMon)
activate DiemRepo
DiemRepo -> DB : SELECT * FROM DIEM\nWHERE MA_SV = ? AND MA_MON = ?
activate DB
DB --> DiemRepo : ResultSet
deactivate DB
DiemRepo --> Service : Optional<Diem>
deactivate DiemRepo

alt Điểm đã tồn tại
    Service -> Service : updateExistingDiem()
    Service -> DiemRepo : save(diem)
    activate DiemRepo
    DiemRepo -> DB : UPDATE DIEM SET\nDIEM_CC = ?, DIEM_GK = ?, DIEM_CK = ?,\nDIEM_TONG_KET = ?\nWHERE MA_DIEM = ?
    activate DB
    DB --> DiemRepo : Updated
    deactivate DB
    DiemRepo --> Service : Diem
    deactivate DiemRepo
else Điểm mới
    Service -> Service : createNewDiem()
    Service -> DiemRepo : save(diem)
    activate DiemRepo
    DiemRepo -> DB : INSERT INTO DIEM\n(MA_SV, MA_MON, MA_LOP, DIEM_CC, DIEM_GK, DIEM_CK, DIEM_TONG_KET)\nVALUES (?, ?, ?, ?, ?, ?, ?)
    activate DB
    DB --> DiemRepo : Inserted
    deactivate DB
    DiemRepo --> Service : Diem
    deactivate DiemRepo
end

Service -> Email : sendEmailToStudent(maSV, diemInfo)
activate Email
Email -> DB : SELECT EMAIL FROM SINH_VIEN WHERE MA_SV = ?
activate DB
DB --> Email : email
deactivate DB
Email -> Email : composeEmail(template, data)
Email -> Email : sendMail(to, subject, content)
Email --> Service : emailSent
deactivate Email

Service --> Controller : DiemResponse
deactivate Service

Controller --> GV : 200 OK + "Lưu điểm thành công"
deactivate Controller

@enduml
```

#### 2.2.2. Xem bảng điểm cá nhân - Chi tiết

```plantuml
@startuml
title Xem bảng điểm cá nhân - Chi tiết tương tác

actor "Sinh Viên" as SV
participant ":BangDiemController" as Controller
participant ":BangDiemService" as Service
participant ":TaiKhoanService" as AuthService
participant ":DiemRepository" as DiemRepo
participant ":MonHocRepository" as MonRepo
database "Database" as DB

SV -> Controller : GET /api/bangdiem/hocky
activate Controller
Controller -> AuthService : getCurrentSinhVien(token)
activate AuthService
AuthService --> Controller : SinhVien
deactivate AuthService

Controller -> Service : getHocKyList(maSV)
activate Service
Service -> DB : SELECT DISTINCT HOC_KY, NAM_HOC\nFROM DIEM d\nJOIN LOP_TIN_CHI l ON d.MA_LOP = l.MA_LOP\nWHERE d.MA_SV = ?\nORDER BY NAM_HOC DESC, HOC_KY DESC
activate DB
DB --> Service : ResultSet
deactivate DB
Service --> Controller : List<HocKy>
deactivate Service

Controller --> SV : 200 OK + danh sách học kỳ
deactivate Controller

SV -> Controller : GET /api/bangdiem/{hocKy}
activate Controller
Controller -> Service : getBangDiem(maSV, hocKy)
activate Service

Service -> DiemRepo : findByMaSVAndHocKy(maSV, hocKy)
activate DiemRepo
DiemRepo -> DB : SELECT d.*, mh.TEN_MON, mh.SO_TC, l.HOC_KY, l.NAM_HOC\nFROM DIEM d\nJOIN MON_HOC mh ON d.MA_MON = mh.MA_MON\nJOIN LOP_TIN_CHI l ON d.MA_LOP = l.MA_LOP\nWHERE d.MA_SV = ? AND l.HOC_KY = ?
activate DB
DB --> DiemRepo : ResultSet
deactivate DB
DiemRepo --> Service : List<Diem>
deactivate DiemRepo

Service -> Service : calculateDiemTrungBinh(listDiem)
note right
  Công thức:
  DTB = Σ(Điểm * Số TC) / Σ(Số TC)
end note

Service -> Service : calculateDiemTichLuy(maSV)
note right
  Tính tích lũy từ tất cả các kỳ
end note

Service -> Service : xepLoaiHocLuc(diemTB)
note right
  Xuất sắc: >= 9.0
  Giỏi: >= 8.0
  Khá: >= 7.0
  Trung bình: >= 5.5
  Yếu: < 5.5
end note

Service --> Controller : BangDiemResponse
deactivate Service

Controller --> SV : 200 OK + bảng điểm đầy đủ
deactivate Controller

opt Xuất PDF
    SV -> Controller : GET /api/bangdiem/export/pdf
    activate Controller
    Controller -> Service : exportToPDF(maSV, hocKy)
    activate Service
    Service -> Service : generatePDFContent()
    Service --> Controller : byte[] pdfData
    deactivate Service
    Controller --> SV : PDF File
    deactivate Controller
end

@enduml
```

#### 2.2.3. Thống kê điểm trung bình - Chi tiết

```plantuml
@startuml
title Thống kê điểm trung bình - Chi tiết tương tác

actor "Lãnh Đạo" as LD
participant ":ThongKeController" as Controller
participant ":ThongKeService" as Service
participant ":DiemRepository" as DiemRepo
participant ":AnalyticsService" as Analytics
database "Database" as DB

LD -> Controller : GET /api/thongke/overview
activate Controller
Controller -> Service : getThongKeOverview()
activate Service

Service -> DiemRepo : getStatisticsSummary()
activate DiemRepo
DiemRepo -> DB : SELECT \n  COUNT(DISTINCT MA_SV) as tongSV,\n  AVG(DIEM_TONG_KET) as diemTB,\n  COUNT(CASE WHEN DIEM_TONG_KET >= 5 THEN 1 END) as soDau,\n  COUNT(CASE WHEN DIEM_TONG_KET < 5 THEN 1 END) as soRot\nFROM DIEM
activate DB
DB --> DiemRepo : ResultSet
deactivate DB
DiemRepo --> Service : StatisticsSummary
deactivate DiemRepo

Service --> Controller : ThongKeOverview
deactivate Service
Controller --> LD : 200 OK + dữ liệu tổng quan
deactivate Controller

LD -> Controller : POST /api/thongke/filter
note right
  Body: {
    "khoa": "CNTT",
    "lop": "19TCLC_DT3",
    "hocKy": "1",
    "namHoc": "2024-2025",
    "maMon": "MON01"
  }
end note
activate Controller

Controller -> Service : getThongKeWithFilter(filter)
activate Service

Service -> DiemRepo : findWithFilter(filter)
activate DiemRepo
DiemRepo -> DB : SELECT d.*, sv.HO, sv.TEN, mh.TEN_MON, l.TEN_LOP\nFROM DIEM d\nJOIN SINH_VIEN sv ON d.MA_SV = sv.MA_SV\nJOIN MON_HOC mh ON d.MA_MON = mh.MA_MON\nJOIN LOP_TIN_CHI l ON d.MA_LOP = l.MA_LOP\nWHERE l.HOC_KY = ? AND l.NAM_HOC = ?\nAND sv.KHOA = ? AND sv.LOP = ?\nAND d.MA_MON = ?
activate DB
DB --> DiemRepo : ResultSet
deactivate DB
DiemRepo --> Service : List<Diem>
deactivate DiemRepo

Service -> Analytics : analyzeData(listDiem)
activate Analytics

Analytics -> Analytics : calculateAverage()
Analytics -> Analytics : calculateMedian()
Analytics -> Analytics : calculateStandardDeviation()
Analytics -> Analytics : groupByRanges()
note right
  Xuất sắc: 9.0 - 10
  Giỏi: 8.0 - 8.9
  Khá: 7.0 - 7.9
  Trung bình: 5.5 - 6.9
  Yếu: < 5.5
end note

Analytics -> Analytics : calculatePassRate()
Analytics --> Service : AnalyticsResult
deactivate Analytics

Service -> Service : compareWithPreviousSemester(filter)
note right
  So sánh với học kỳ trước
  để xem xu hướng
end note

Service --> Controller : ThongKeDetailResponse
deactivate Service

Controller --> LD : 200 OK + dữ liệu thống kê chi tiết
deactivate Controller

opt Xuất báo cáo
    LD -> Controller : POST /api/thongke/export
    activate Controller
    Controller -> Service : exportReport(filter, format)
    activate Service
    
    alt format == "excel"
        Service -> Service : generateExcelReport()
        Service --> Controller : byte[] excelData
    else format == "pdf"
        Service -> Service : generatePDFReport()
        Service --> Controller : byte[] pdfData
    end
    
    deactivate Service
    Controller --> LD : File download
    deactivate Controller
end

@enduml
```

