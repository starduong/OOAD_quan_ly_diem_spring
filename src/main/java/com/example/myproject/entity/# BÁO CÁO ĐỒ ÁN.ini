# BÁO CÁO ĐỒ ÁN
## HỆ THỐNG QUẢN LY SINH VIÊN VÀ ĐIỂM SỐ

---

## THÔNG TIN ĐỀ TÀI

**Tên đề tài:** Hệ thống quản lý sinh viên và điểm số

**Use cases chính:**
- Cập nhật điểm thi
- Xem bảng điểm cá nhân
- Thống kê điểm trung bình

**Vấn đề hiện tại:**
- Giảng viên phải nhập điểm thủ công, dễ sai
- Sinh viên phải lên phòng ban để xem điểm, tra cứu tốn thời gian

**Lợi ích của phần mềm:**
- Giảng viên có thể nhập điểm trực tuyến
- Sinh viên xem bảng điểm cá nhân, tra cứu kết quả thi
- Thống kê điểm một cách dễ dàng

---

## 1. MÔ TẢ MÔI TRƯỜNG VẬN HÀNH

### 1.1. Mô hình vận hành cũ (Thủ công)

#### 1.1.1. Use case: Cập nhật điểm thi

**Mô tả quy trình thủ công:**

1. Giảng viên chấm bài thi của sinh viên
2. Giảng viên ghi điểm vào sổ điểm giấy
3. Giảng viên nộp sổ điểm cho phòng Khảo thí
4. Nhân viên phòng Khảo thí nhập điểm vào hệ thống Excel
5. Nhân viên kiểm tra và in bảng điểm
6. Bảng điểm được lưu trữ tại phòng Khảo thí

**Lược đồ giao tiếp (Communication Diagram) - Mô hình cũ:**

```plantuml
; @startuml
; title Cập nhật điểm thi - Mô hình thủ công

; object "Giảng Viên" as GV
; object "Sổ Điểm Giấy" as So
; object "Nhân Viên PKT" as NV
; object "File Excel" as Excel
; object "Máy In" as Printer

; GV -> So : 1: Ghi điểm vào sổ
; GV -> NV : 2: Nộp sổ điểm
; NV -> So : 3: Lấy thông tin điểm
; NV -> Excel : 4: Nhập điểm vào Excel
; NV -> Excel : 5: Kiểm tra dữ liệu
; Excel -> NV : 6: Hiển thị dữ liệu
; NV -> Printer : 7: In bảng điểm
; Printer -> NV : 8: Bảng điểm giấy

; @enduml
```

**Phân tích ưu khuyết điểm:**

**Ưu điểm:**
- Không phụ thuộc vào công nghệ
- Dễ triển khai ban đầu
- Không cần đào tạo kỹ thuật phức tạp

**Khuyết điểm:**
- Tốn thời gian: Quy trình từ chấm bài đến lưu trữ mất 3-5 ngày
- Dễ sai sót: Sai sót khi ghi chép, nhập liệu
- Khó tra cứu: Sinh viên phải đến phòng ban để xem điểm
- Khó bảo mật: Sổ điểm giấy dễ thất lạc
- Không có backup: Mất dữ liệu khi giấy tờ bị hỏng
- Tốn không gian lưu trữ
- Khó thống kê và phân tích

#### 1.1.2. Use case: Xem bảng điểm cá nhân

**Mô tả quy trình thủ công:**

1. Sinh viên đến phòng Khảo thí
2. Sinh viên điền phiếu yêu cầu xem điểm
3. Nhân viên tra cứu trong sổ sách hoặc tủ hồ sơ
4. Nhân viên tìm bảng điểm của sinh viên
5. Nhân viên cho sinh viên xem hoặc photo bảng điểm
6. Sinh viên nhận kết quả

**Lược đồ giao tiếp - Mô hình cũ:**

; ```plantuml
; @startuml
; title Xem bảng điểm cá nhân - Mô hình thủ công

; object "Sinh Viên" as SV
; object "Phiếu Yêu Cầu" as Phieu
; object "Nhân Viên PKT" as NV
; object "Tủ Hồ Sơ" as Tu
; object "Bảng Điểm Giấy" as Bang
; object "Máy Photocopy" as Photo

; SV -> Phieu : 1: Điền phiếu yêu cầu
; SV -> NV : 2: Nộp phiếu
; NV -> Phieu : 3: Đọc thông tin
; NV -> Tu : 4: Mở tủ hồ sơ
; Tu -> NV : 5: Lấy hồ sơ sinh viên
; NV -> Bang : 6: Tìm bảng điểm
; Bang -> NV : 7: Thông tin điểm
; NV -> Photo : 8: Photo bảng điểm
; Photo -> SV : 9: Trả bản sao

; @enduml
```

**Phân tích ưu khuyết điểm:**

**Ưu điểm:**
- Bảo mật cao (chỉ nhân viên mới truy cập được)
- Không cần internet

**Khuyết điểm:**
- Tốn thời gian: Sinh viên phải đến phòng ban trong giờ hành chính
- Không linh hoạt: Chỉ xem được tại phòng Khảo thí
- Tốn chi phí: Chi phí in ấn, photocopy
- Hạn chế về mặt thời gian: Chỉ tra cứu được trong giờ làm việc
- Khó khăn cho sinh viên ở xa

#### 1.1.3. Use case: Thống kê điểm trung bình

**Mô tả quy trình thủ công:**

1. Nhân viên thu thập tất cả bảng điểm của lớp/khóa
2. Nhân viên sử dụng máy tính cầm tay để tính toán
3. Nhân viên ghi kết quả vào file Excel
4. Nhân viên tạo biểu đồ thủ công hoặc dùng Excel
5. In báo cáo và nộp cho lãnh đạo

**Lược đồ giao tiếp - Mô hình cũ:**

```plantuml
@startuml
title Thống kê điểm trung bình - Mô hình thủ công

object "Lãnh Đạo" as LD
object "Nhân Viên PKT" as NV
object "Tủ Hồ Sơ" as Tu
object "Bảng Điểm Giấy" as Bang
object "Máy Tính Cầm Tay" as May
object "File Excel" as Excel
object "Báo Cáo" as BC

LD -> NV : 1: Yêu cầu báo cáo
NV -> Tu : 2: Lấy tất cả bảng điểm
Tu -> Bang : 3: Tập hợp bảng điểm
Bang -> NV : 4: Dữ liệu điểm
NV -> May : 5: Tính toán trung bình
May -> NV : 6: Kết quả tính toán
NV -> Excel : 7: Nhập kết quả
Excel -> BC : 8: Tạo báo cáo
BC -> LD : 9: Nộp báo cáo

@enduml
```

**Phân tích ưu khuyết điểm:**

**Ưu điểm:**
- Có thể tùy chỉnh báo cáo theo yêu cầu

**Khuyết điểm:**
- Rất tốn thời gian: Có thể mất 1-2 ngày để hoàn thành
- Dễ sai sót: Sai sót trong tính toán
- Không real-time: Dữ liệu không được cập nhật liên tục
- Khó so sánh: Khó so sánh giữa các kỳ, các lớp
- Thiếu trực quan: Biểu đồ thủ công không đẹp và rõ ràng

