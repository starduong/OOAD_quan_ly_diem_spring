#### 1.2.2. Use case: Cập nhật điểm thi

**Lược đồ tuần tự (tt-1):**

```plantuml
@startuml
title Cập nhật điểm thi - Có phần mềm

actor "Giảng Viên" as GV
participant "Giao Diện Web" as UI
participant "Hệ Thống" as System
database "Database" as DB
participant "Email Service" as Email

GV -> UI : Đăng nhập hệ thống
activate UI
UI -> System : Xác thực tài khoản(username, password)
activate System
System -> DB : Kiểm tra thông tin đăng nhập
activate DB
DB --> System : Thông tin giảng viên
deactivate DB
System --> UI : Token xác thực
deactivate System
UI --> GV : Hiển thị trang chủ
deactivate UI

GV -> UI : Chọn "Nhập điểm"
activate UI
UI -> System : Lấy danh sách lớp học
activate System
System -> DB : Query danh sách lớp
activate DB
DB --> System : Danh sách lớp
deactivate DB
System --> UI : Danh sách lớp
deactivate System
UI --> GV : Hiển thị danh sách lớp
deactivate UI

GV -> UI : Chọn lớp học
activate UI
UI -> System : Lấy danh sách sinh viên(maLop)
activate System
System -> DB : Query danh sách SV
activate DB
DB --> System : Danh sách sinh viên
deactivate DB
System --> UI : Danh sách sinh viên
deactivate System
UI --> GV : Hiển thị danh sách SV
deactivate UI

GV -> UI : Nhập điểm cho từng SV
activate UI
UI -> System : Lưu điểm(maSV, maMon, diem)
activate System
System -> DB : INSERT/UPDATE điểm
activate DB
DB --> System : Kết quả lưu
deactivate DB
System -> Email : Gửi thông báo cho SV
activate Email
Email --> System : Email đã gửi
deactivate Email
System --> UI : Thông báo thành công
deactivate System
UI --> GV : "Lưu điểm thành công"
deactivate UI

@enduml
```

**Lược đồ hoạt động (Activity Diagram):**

```plantuml
@startuml
title Quy trình cập nhật điểm thi

start
:Giảng viên đăng nhập;
:Hệ thống xác thực;
if (Đăng nhập thành công?) then (yes)
  :Hiển thị danh sách lớp học;
  :Giảng viên chọn lớp;
  :Hiển thị danh sách sinh viên;
  
  fork
    :Nhập điểm chuyên cần;
  fork again
    :Nhập điểm giữa kỳ;
  fork again
    :Nhập điểm cuối kỳ;
  end fork
  
  :Nhập điểm tổng kết;
  :Kiểm tra tính hợp lệ;
  
  if (Dữ liệu hợp lệ?) then (yes)
    :Lưu vào database;
    :Gửi email thông báo cho SV;
    :Hiển thị thông báo thành công;
  else (no)
    :Hiển thị lỗi;
    :Yêu cầu nhập lại;
  endif
else (no)
  :Hiển thị lỗi đăng nhập;
  stop
endif

stop
@enduml
```

**Lược đồ trạng thái (State Diagram) cho Điểm:**

```plantuml
@startuml
title Trạng thái của bản ghi Điểm

