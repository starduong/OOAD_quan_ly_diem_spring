DangNhap --> ChuaNhap : Hủy nhập

DaNhap --> ChoDuyet : Gửi duyệt
ChoDuyet --> DaDuyet : Nhân viên duyệt
ChoDuyet --> DaNhap : Từ chối, yêu cầu sửa

DaDuyet --> [*] : Hoàn tất

DaNhap --> DangNhap : Chỉnh sửa
DaDuyet --> DangNhap : Sửa điểm (có phê duyệt)

@enduml
```

