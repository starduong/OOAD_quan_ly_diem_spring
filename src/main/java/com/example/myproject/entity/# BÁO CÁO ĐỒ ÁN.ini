│ - GiangVien                             │
└─────────────────────────────────────────┘
```

**Phân tích kịch bản:**

1. **Actor:** Giảng Viên
2. **Precondition:** Giảng viên đã được phân công giảng dạy lớp
3. **Main Flow:**
   - Giảng viên đăng nhập (TaiKhoan xác thực)
   - Hệ thống hiển thị danh sách lớp (LopTinChi)
   - Giảng viên chọn lớp
   - Hệ thống hiển thị danh sách sinh viên (SinhVien)
   - Giảng viên nhập điểm cho từng sinh viên (Diem)
   - Hệ thống tính điểm tổng kết (MonHoc cung cấp công thức)
   - Hệ thống lưu điểm (Diem)
   - Hệ thống gửi email thông báo (EmailService)
4. **Postcondition:** Điểm được lưu và sinh viên nhận được thông báo

