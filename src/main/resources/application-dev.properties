# ===================================
# DEVELOPMENT CONFIGURATION
# ===================================
# File này chỉ active khi chạy với profile "dev"
# Sử dụng: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# Hiển thị banner cảnh báo
spring.main.banner-mode=console

# Database configuration (giữ nguyên từ file chính)
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OOAD_QLSV;encrypt=false
# spring.datasource.username=sa
# spring.datasource.password=your_password

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.myproject=DEBUG

# Thymeleaf - disable cache for hot reload
spring.thymeleaf.cache=false

# DevTools
spring.devtools.restart.enabled=true

# BANNER WARNING
spring.banner.location=classpath:banner-dev.txt
