<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Trang admin </title>
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/admin/images/favicon.png}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.carousel.min.css}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.theme.default.min.css}" />
    <link th:href="@{/admin/vendor/jqvmap/css/jqvmap.min.css}" rel="stylesheet" />
    <link th:href="@{/admin/css/style.css}" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .content-body {
            padding: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>

</head>

<body>
    <div id="main-wrapper">
        <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>
        <div th:replace="~{admin/layout/header :: header}"></div>

        <div class="content-body">
            <div class="container-fluid">
                <h1 class="text-3xl font-bold mb-4">Chào mừng đến với trang quản trị</h1>
                <p>Quản lý hệ thống của bạn từ đây.</p>
            </div>
        </div>
    <script th:src="@{/admin/vendor/global/global.min.js}"></script>
    <script th:src="@{/admin/js/quixnav-init.js}"></script>
    <script th:src="@{/admin/js/custom.min.js}"></script>

</body>

</html>
